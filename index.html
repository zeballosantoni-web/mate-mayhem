<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Combate Charrúa</title><style>*{box-sizing:border-box}body{margin:0;background:#071526;color:#fff8dd;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none}canvas{width:100vw;height:100vh;display:block}.screen{position:fixed;inset:0;display:grid;place-items:center;background:#061424e8;z-index:4;padding:18px}.panel{max-width:760px;width:100%;background:linear-gradient(135deg,#113b61,#09243d);border:4px solid #f3ca64;box-shadow:0 0 0 5px #65cbe8,0 16px 60px #000a;padding:clamp(18px,4vw,38px);text-align:center}.logo{font:900 clamp(40px,9vw,78px)/.82 Georgia,serif;color:#f5ce65;text-shadow:4px 4px #12658a,-3px -2px #fff;letter-spacing:-3px}.sub{color:#9eeaff;letter-spacing:3px;margin:12px}.pick{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:26px 0}.card{border:3px solid #61c9e8;background:#0b2740;color:white;padding:14px;min-width:220px;cursor:pointer;font:700 18px inherit}.card:hover,.card.sel{background:#1b6683;border-color:#f6d16e;transform:translateY(-3px)}.card b{display:block;color:#ffd66f;font-size:25px}.small{font-size:13px;color:#d2ecf2;line-height:1.5}.start{font:900 18px inherit;background:#f4cb65;color:#07304d;border:0;padding:14px 28px;cursor:pointer;box-shadow:0 4px #bd8e24}.hide{display:none}.touch{position:fixed;bottom:15px;z-index:3;display:flex;gap:8px}.touch.left{left:15px}.touch.right{right:15px}.touch button{width:54px;height:54px;border-radius:50%;border:2px solid #ffd66f;background:#0b416dcc;color:white;font-weight:900;font-size:15px}.touch .wide{width:66px;border-radius:18px}</style></head><body><canvas id="c" width="1280" height="720"></canvas><div id="menu" class="screen"><div class="panel"><div class="logo">COMBATE<br>CHARRÚA</div><div class="sub">ETAPA 1 · DUELO LOCAL</div><p>Elegí luchador para el lado izquierdo. El rival usa el otro.</p><div class="pick"><button class="card sel" data-p="gaucho"><b>EL GAUCHO 🧉</b>Equilibrado · Boleadoras<br><span class="small">Velocidad 6 · Fuerza 7 · Defensa 6</span></button><button class="card" data-p="candombera"><b>LA CANDOMBERA 🥁</b>Rápida · Ondas de tambor<br><span class="small">Velocidad 9 · Fuerza 5 · Defensa 4</span></button></div><button id="start" class="start">¡DALE, A PELEAR!</button><p class="small">J1: A/D mover · W saltar · S agachar · F puño · G patada · H bloquear<br>J2: ←/→ mover · ↑ saltar · ↓ agachar · K puño · L patada · Ñ bloquear</p></div></div><div class="touch left"><button data-k="a">◀</button><button data-k="d">▶</button><button data-k="w">▲</button><button data-k="s">▼</button></div><div class="touch right"><button class="wide" data-k="f">PUÑO</button><button class="wide" data-k="g">PATA</button><button data-k="h">BLOQ</button></div><script>
/* PERSONAJES */const C=document.querySelector('#c'),x=C.getContext('2d'),W=1280,H=720,keys={};const chars={gaucho:{n:'EL GAUCHO',speed:330,pow:17,def:1,col:'#e1a45a',accent:'#6c3a22',special:'Boleadoras'},candombera:{n:'LA CANDOMBERA',speed:400,pow:13,def:.88,col:'#d94d72',accent:'#f1c64e',special:'Onda de tambor'}};let choice='gaucho',running=false,last=0,round=1,win=[0,0],time=99,freeze=0,message='',msgT=0,audio=null,beat=0;
function fighter(type,side){let q=chars[type];return{type,side,x:side?920:360,y:555,vx:0,vy:0,face:side?-1:1,hp:100,power:0,act:'idle',actT:0,stun:0,crouch:false,block:false,combo:0,comboT:0,q}}let p=[fighter('gaucho',0),fighter('candombera',1)];
/* AUDIO */function sound(f=110,d=.08,type='sine'){if(!audio)return;let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=f;o.connect(g);g.connect(audio.destination);g.gain.setValueAtTime(.09,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.start();o.stop(audio.currentTime+d)}function music(dt){beat+=dt;if(beat>.42){beat=0;sound(round%2?105:155,.08,'triangle')}}
function press(k,on){keys[k]=on;if(on&&audio&&audio.state==='suspended')audio.resume()}addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['a','d','w','s','f','g','h','arrowleft','arrowright','arrowup','arrowdown','k','l','ñ'].includes(k)){e.preventDefault();press(k,true)}});addEventListener('keyup',e=>press(e.key.toLowerCase(),false));document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();press(k,true)};['pointerup','pointerleave','pointercancel'].forEach(v=>b.addEventListener(v,e=>{e.preventDefault();press(k,false)}))});document.querySelectorAll('.card').forEach(b=>b.onclick=()=>{choice=b.dataset.p;document.querySelectorAll('.card').forEach(z=>z.classList.toggle('sel',z===b))});document.querySelector('#start').onclick=()=>{audio=new (window.AudioContext||window.webkitAudioContext)();p=[fighter(choice,0),fighter(choice==='gaucho'?'candombera':'gaucho',1)];document.querySelector('#menu').classList.add('hide');startRound();running=true};
/* FÍSICA */function startRound(){time=99;freeze=1.2;message='ROUND '+round;msgT=1.5;p.forEach((z,i)=>Object.assign(z,fighter(z.type,i)))}function control(z,i,dt){let m=i?{l:'arrowleft',r:'arrowright',j:'arrowup',c:'arrowdown',p:'k',k:'l',b:'ñ'}:{l:'a',r:'d',j:'w',c:'s',p:'f',k:'g',b:'h'};z.block=!!keys[m.b];z.crouch=!!keys[m.c]&&z.y>=555;if(z.stun>0)return;let dir=(keys[m.l]?-1:0)+(keys[m.r]?1:0);z.vx=dir*z.q.speed;if(dir)z.face=dir;if(keys[m.j]&&z.y>=555){z.vy=-690;sound(210,.08,'square')}if(z.actT<=0){if(keys[m.p])attack(z,'punch');else if(keys[m.k])attack(z,z.crouch?'sweep':'kick');else if(keys[m.c]&&(keys[m.r]||keys[m.l]))attack(z,'special')}z.vy+=1750*dt;z.x+=z.vx*dt;z.y+=z.vy*dt;if(z.y>555){z.y=555;z.vy=0}z.x=Math.max(85,Math.min(1195,z.x));z.actT=Math.max(0,z.actT-dt);z.stun=Math.max(0,z.stun-dt);z.comboT=Math.max(0,z.comboT-dt);if(!z.comboT)z.combo=0}
/* HITBOXES, ATAQUES Y COMBOS */function attack(z,kind){z.act=kind;z.actT=kind==='special'?.5:.25;let foe=p[1-z.side],range=kind==='special'?250:kind==='kick'?135:110,dmg=(kind==='special'?22:kind==='kick'?15:11)*z.q.pow/15;if(Math.abs(foe.x-z.x)<range&&Math.abs(foe.y-z.y)<100&&foe.stun<=0){let blocked=foe.block&&foe.face===-z.face;dmg*=blocked?.25:foe.q.def;foe.hp=Math.max(0,foe.hp-dmg);foe.power=Math.min(100,foe.power+10);z.power=Math.min(100,z.power+13);foe.stun=blocked?.08:.19;z.combo=z.comboT>0?z.combo+1:1;z.comboT=.8;message=blocked?'¡BLOQUEO!':z.combo>1?z.combo+' GOLPES!':kind==='special'?'¡'+z.q.special.toUpperCase()+'!':'¡DALE!';msgT=.5;sound(kind==='special'?65:110,.13,'sawtooth');if(!foe.hp)ko(z)}}function ko(z){freeze=2;win[z.side]++;message='¡TERMINALA!';msgT=2.5;sound(45,.7,'sawtooth');setTimeout(()=>{if(win[z.side]>=2){message='¡GANASTE, BOTIJA!';msgT=999;running=false;setTimeout(()=>document.querySelector('#menu').classList.remove('hide'),2500)}else{round++;startRound()}},1900)}
/* INTERFAZ Y ESCENARIO: RAMBLA DE MONTEVIDEO */function bar(px,py,w,v,col,flip){x.fillStyle='#061323';x.fillRect(px,py,w,22);x.strokeStyle='#f5cf67';x.lineWidth=3;x.strokeRect(px,py,w,22);x.fillStyle=col;let ww=w*v/100;x.fillRect(flip?px+w-ww:px,py,ww,22)}function text(t,X,Y,size=25,col='#fff8dd'){x.font=`900 ${size}px Arial`;x.textAlign='center';x.fillStyle='#06223a';x.fillText(t,X+3,Y+3);x.fillStyle=col;x.fillText(t,X,Y)}function bg(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#86d9ef');g.addColorStop(.53,'#eaf3df');g.addColorStop(.54,'#cca66a');g.addColorStop(1,'#70482c');x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='#ffffff99';for(let i=0;i<9;i++)x.fillRect(50+i*150,180+(i%3)*15,105,9);x.fillStyle='#d7b06c';x.fillRect(0,570,W,150);for(let i=0;i<W;i+=80){x.fillStyle=i%160?'#9a6238':'#c4874a';x.fillRect(i,570,42,150)}x.fillStyle='#315a6c';x.fillRect(0,530,W,40)}function drawF(z){x.save();x.translate(z.x,z.y);x.scale(z.face,1);let q=z.crouch?22:0;x.fillStyle='#0005';x.beginPath();x.ellipse(0,48,55,11,0,0,7);x.fill();x.fillStyle=z.q.col;x.fillRect(-34,-55+q,68,90-q);x.fillStyle=z.q.accent;x.fillRect(-38,-63+q,76,14);x.fillStyle='#f2bb92';x.beginPath();x.arc(0,-80+q,29,0,7);x.fill();x.fillStyle='#17202b';x.fillRect(-27,-111+q,54,14);x.fillStyle=z.q.accent;x.fillRect(-44,-115+q,88,7);x.strokeStyle='#f2bb92';x.lineWidth=14;x.beginPath();if(z.actT>0){x.moveTo(24,-42+q);x.lineTo(92,-62+q)}else{x.moveTo(20,-36+q);x.lineTo(42,q)}x.stroke();x.strokeStyle='#173044';x.lineWidth=18;x.beginPath();x.moveTo(-19,30);x.lineTo(-24,61);x.moveTo(19,30);x.lineTo(28,61);x.stroke();if(z.act==='special'&&z.actT>0){x.strokeStyle=z.type==='gaucho'?'#f5d266':'#d76bc3';x.lineWidth=8;x.beginPath();x.arc(88,-45,28,0,7);x.stroke()}x.restore()}function draw(){bg();bar(55,55,420,p[0].hp,'#55cde5');bar(805,55,420,p[1].hp,'#ec6290',true);bar(55,83,220,p[0].power,'#f2cb65');bar(1005,83,220,p[1].power,'#f2cb65',true);text(p[0].q.n,265,43,19);text(p[1].q.n,1015,43,19);text(''+Math.ceil(time),640,74,40,'#f4d16b');text('●'.repeat(win[0])+'  ROUND '+round+'  '+'●'.repeat(win[1]),640,105,16);drawF(p[0]);drawF(p[1]);if(msgT>0)text(message,640,170,34,'#fff1ae')}
/* BUCLE 60 FPS */function loop(now){let dt=Math.min(.033,(now-last||16)/1000);last=now;if(running){if(freeze>0)freeze-=dt;else{time-=dt;if(time<=0)ko(p[0].hp>=p[1].hp?p[0]:p[1]);control(p[0],0,dt);control(p[1],1,dt);music(dt)}msgT=Math.max(0,msgT-dt)}draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
