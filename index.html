<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Mate Mayhem</title><style>body{margin:0;background:#171126;color:#fff7df;font:16px system-ui;text-align:center}.top{padding:14px;background:#2c1e43}.top b{font:900 28px Georgia;color:#f8cf65}.top span{color:#76dc9d}#game{width:min(100%,1000px);aspect-ratio:16/9;background:linear-gradient(#473568 0 55%,#385477 56%);display:block;margin:auto;touch-action:none}.hud{display:flex;justify-content:space-between;max-width:1000px;margin:10px auto;font-weight:bold}.bar{width:38vw;max-width:350px;height:16px;background:#120d20;border:2px solid #f8cf65;border-radius:9px}.bar i{display:block;height:100%;background:#70d598;width:100%}.right i{background:#ff758f;margin-left:auto}.panel{max-width:680px;margin:12px auto;padding:16px;background:#281c3c;border:2px solid #8060a7;border-radius:16px}.cards{display:flex;gap:8px;justify-content:center}.cards button,button{border:1px solid #f8cf65;background:#493263;color:white;border-radius:10px;padding:10px;font-weight:bold}.cards button{font-size:28px}.cards button.on{background:#aa4264}.hidden{display:none}.touch{display:flex;justify-content:space-between;max-width:700px;margin:auto;padding:10px}.touch button{width:58px;height:50px;font-size:18px}@media(min-width:700px){.touch{display:none}}</style><div class="top"><b>MATE <span>MAYHEM</span></b><div id="net">Elige personaje y crea sala</div></div><div class="hud"><div><span id="na">JUGADOR 1</span><div class="bar"><i id="ha"></i></div></div><b id="time">60</b><div><span id="nb">JUGADOR 2</span><div class="bar right"><i id="hb"></i></div></div></div><canvas id="game" width="960" height="540"></canvas><div class="touch"><div><button data-k="l">◀</button><button data-k="r">▶</button></div><div><button data-k="j">▲</button><button data-k="h">✦</button></div></div><div class="panel" id="lobby"><h2>Duelo online para dos</h2><p>Elige personaje, crea una sala y comparte el código con tu rival.</p><div class="cards" id="cards"></div><p><button id="host">Crear sala</button> <button id="showJoin">Unirse</button></p><div id="joinBox" class="hidden"><input id="code" maxlength="5" placeholder="CÓDIGO" style="padding:10px;text-transform:uppercase"><button id="join">Entrar</button></div><p id="info"></p></div><p id="msg">A/D mover · W saltar · F golpear</p><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><script>var R=[['🧉','Maestro del Mate','#62cd99'],['🎭','Reina del Carnaval','#ff7795'],['⚓','Guardián del Puerto','#79adff']],pick=0,peer,con,role,room,t=60,go=0,last=0;var P=[{},{}],K={};var $=function(x){return document.querySelector(x)};function cards(){$('#cards').innerHTML='';R.forEach(function(a,i){var b=document.createElement('button');b.textContent=a[0];if(i==0)b.className='on';b.onclick=function(){pick=i;document.querySelectorAll('.cards button').forEach(function(q,n){q.className=n==i?'on':''})};$('#cards').appendChild(b)})}function reset(){P=[{x:240,y:390,vx:0,vy:0,hp:100,f:pick,dir:1},{x:720,y:390,vx:0,vy:0,hp:100,f:1,dir:-1}];t=60;go=0;ui()}function say(x){$('#msg').textContent=x}function ui(){$('#na').textContent=R[P[0].f].slice(1,2)[0];$('#nb').textContent=R[P[1].f].slice(1,2)[0];$('#ha').style.width=P[0].hp+'%';$('#hb').style.width=P[1].hp+'%';$('#time').textContent=Math.ceil(t)}function send(o){if(con&&con.open)con.send(o)}function start(){$('#lobby').className='panel hidden';reset();say('¡QUE EMPIECE EL DUELO!');requestAnimationFrame(loop)}function bind(){con.on('open',function(){send({x:'hi',f:pick});start()});con.on('data',function(o){if(o.x=='hi')P[role=='host'?1:0].f=o.f;if(o.x=='k')P[role=='host'?1:0][o.k]=o.v;if(o.x=='new'){reset();say('Nueva ronda')}})}function host(){room=Math.random().toString(36).slice(2,7).toUpperCase();role='host';peer=new Peer('mate-'+room);peer.on('open',function(){$('#info').innerHTML='Código de sala: <b>'+room+'</b><br>Envíalo a tu rival.';$('#net').textContent='Esperando rival: '+room});peer.on('connection',function(c){con=c;bind()});peer.on('error',function(){$('#info').textContent='Prueba creando otra sala.'})}function join(){room=$('#code').value.toUpperCase();if(room.length<5)return;role='guest';peer=new Peer();peer.on('open',function(){con=peer.connect('mate-'+room);bind()});peer.on('error',function(){$('#info').textContent='No encontramos esa sala.'})}function key(k,v){var q=P[role=='host'?0:1];q[k]=v;send({x:'k',k:k,v:v})}function hit(a,b){if(a.at&&a.at<.13&&Math.abs(a.x-b.x)<110&&!b.hit){b.hp=Math.max(0,b.hp-14);b.hit=1;say(R[a.f][1]+' ataca');if(!b.hp){go=1;say(R[a.f][1]+' gana!')}}if(!a.at)b.hit=0}function tick(d){if(go||!role)return;t-=d;if(t<0){go=1;say('Fin de ronda');return}P.forEach(function(a,i){var b=P[1-i];if(a.l)a.vx=-290;if(a.r)a.vx=290;if(!a.l&&!a.r)a.vx*=.7;if(a.j&&a.y>=390){a.vy=-500;a.j=0}if(a.h&&!a.at){a.at=.25;a.h=0}a.vy+=1200*d;a.x=Math.max(50,Math.min(910,a.x+a.vx*d));a.y=Math.min(390,a.y+a.vy*d);if(a.y==390)a.vy=0;a.dir=a.x<b.x?1:-1;a.at=Math.max(0,a.at-d);hit(a,b)});ui()}function fighter(a){var z=R[a.f];g.save();g.translate(a.x,a.y);g.scale(a.dir,1);g.fillStyle=z[2];g.fillRect(-28,-25,56,70);g.fillStyle='#ffe1c2';g.beginPath();g.arc(0,-44,29,0,7);g.fill();g.font='53px serif';g.textAlign='center';g.fillText(z[0],0,-25);if(a.at){g.strokeStyle='#f8cf65';g.lineWidth=12;g.beginPath();g.moveTo(20,0);g.lineTo(92,-10);g.stroke()}g.restore()}var g=$('#game').getContext('2d');function draw(){g.clearRect(0,0,960,540);g.fillStyle='#d87967';g.fillRect(0,430,960,110);g.fillStyle='#f7d469';g.beginPath();g.arc(700,85,42,0,7);g.fill();g.fillStyle='#263f4d';for(var x=0;x<960;x+=70)g.fillRect(x,370-(x%130),52,60+x%130);fighter(P[0]);fighter(P[1])}function loop(n){var d=Math.min(.04,(n-last||n)/1000);last=n;tick(d);draw();requestAnimationFrame(loop)}addEventListener('keydown',function(e){var m={a:'l',d:'r',w:'j',f:'h'}[e.key.toLowerCase()];if(m){e.preventDefault();key(m,1)}});addEventListener('keyup',function(e){var m={a:'l',d:'r',w:'j',f:'h'}[e.key.toLowerCase()];if(m)key(m,0)});document.querySelectorAll('.touch button').forEach(function(b){var k=b.dataset.k;b.onpointerdown=function(e){e.preventDefault();key(k,1)};b.onpointerup=b.onpointercancel=b.onpointerleave=function(){key(k,0)}});$('#host').onclick=host;$('#showJoin').onclick=function(){$('#joinBox').className=''};$('#join').onclick=join;cards();reset();draw();</script>
